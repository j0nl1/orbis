name: macOS native tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install test tools
        run: brew install cmake ninja ripgrep
      - name: Run native tests
        run: ORBIS_TEST_SPARKLE_ROOT="$(scripts/prepare-sparkle.sh)" scripts/test-orbis.sh
